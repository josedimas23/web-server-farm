events {
    worker_connections 1024;
}

http {
    upstream backend_josedimasUGR {
        #algoritmo_balanceo(least_conn; round_robin; etc...)
        #round-robin
        server 192.168.10.2:443; # web1
        server 192.168.10.3:443; # web2
        server 192.168.10.4:443; # web3
        server 192.168.10.5:443; # web4
        server 192.168.10.6:443; # web5
        server 192.168.10.7:443; # web6
        server 192.168.10.8:443; # web7
        server 192.168.10.9:443; # web8
    }

    server {

        listen 443 ssl http2;
        server_name nginx_josedimasUGR;
        ssl_certificate /etc/nginx/ssl/certificado_josedimasugr.crt;
        ssl_certificate_key /etc/nginx/ssl/certificado_josedimasugr.key;

        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets on;


        location / {
            proxy_pass https://backend_josedimasUGR;
            proxy_set_header Cookie $http_cookie;
            proxy_hide_header Set-Cookie;
        }
    }
}
