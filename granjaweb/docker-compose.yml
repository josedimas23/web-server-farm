    build:
      context: .
      dockerfile: ./P4-josedimasugr-nginx/DockerFileNginxP4
    image: josedimasugr-nginx-image:p5
    volumes:
     - ./P4-josedimasugr-nginx/josedimasugr-nginx-ssl.conf:/etc/nginx/nginx.conf
     - ./P4-josedimasugr-certificados:/etc/nginx/ssl/
    networks:
      red_web:
        ipv4_address: 192.168.10.50
    depends_on:
      - web1
      - web2
      - web3
      - web4
      - web5
      - web6
      - web7
      - web8
    ports:
      - "8089:443"

networks:
  # Shared with the load tests; created by `make network` (subnet 192.168.10.0/24)
  red_web:
    external: true
  red_servicios:
    ipam:
      config:
        - subnet: 192.168.20.0/24
