services:
  web1:
    build:
      context: .
      dockerfile: ./P4-josedimasugr-apache/DockerFileApacheP4
    image: josedimasugr-apache-image:p5
    volumes:
      - ./index.php:/var/www/html/index.php
      - ./P4-josedimasugr-certificados:/etc/apache2/ssl/
    networks:
      red_web:
        ipv4_address: 192.168.10.2
      red_servicios:
        ipv4_address: 192.168.20.2
    ports:
      - "8080:443"
    cap_add:
      - NET_ADMIN
